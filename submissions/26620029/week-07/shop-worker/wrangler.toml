name = "ddolcom-shop"            # becomes https://ddolcom-shop.<your-subdomain>.workers.dev
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
# ---- shop identity ----
SHOP_NAME = "Ddolcom's BEST SHOP" # name on the market board, in the Agent Card and in every receipt

# ---- shop policy (change, then: npx wrangler@4 deploy) ----
# Reserves are fixed in code: lamp 100, chair 180, bookshelf 260. An ask below a reserve is raised to it.
ASK_LAMP = 150                    # opening ask per item
ASK_CHAIR = 260
ASK_BOOKSHELF = 380
ACCEPT_AFTER = 3                  # from the Nth buyer offer: accept if offer >= reserve and >= halfway to our ask
ACCEPT_ANY = 5                    # from the Nth buyer offer: accept any offer >= reserve
MAX_TURNS = 12                    # buyer messages before the shop ends the talk
SALES_STYLE = "Sell as high as you can, but a deal at or above the reserve is better than losing the buyer."

[ai]
binding = "AI"                    # Workers AI (free daily allowance)

[[durable_objects.bindings]]
name = "TASKS"
class_name = "TaskStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TaskStore"] # SQLite-backed Durable Object: available on the Workers Free plan

[observability]
enabled = true                    # logs in the Cloudflare dashboard
