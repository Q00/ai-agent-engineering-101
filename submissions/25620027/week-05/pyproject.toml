[project]
name = "ax-week05-mirror-market"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "httpx2[http2,brotli,zstd]>2,<3",
  "mcp>=2,<3",
  "openai==3.8.0",
  "pydantic>=2.12,<3",
  "typer>=0.16,<1",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = ["basedpyright>=1.31", "pytest>=8,<10", "ruff>=0.12"]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.12"
include = ["market", "run.py", "tests"]
reportUnnecessaryComparison = "none"
reportUnusedCallResult = "none"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "ISC001", "D203", "D213", "CPY001", "FBT001", "FBT002", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ARG", "PLR2004", "INP001", "SLF001"]
"run.py" = ["T201", "INP001"]
"market/server.py" = ["C901"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
