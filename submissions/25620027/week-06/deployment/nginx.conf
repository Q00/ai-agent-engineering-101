worker_processes 1;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 128;
}

http {
    server_tokens off;
    access_log /dev/stdout combined;
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 5s;
    limit_req_zone $server_name zone=turns:1m rate=30r/m;
    limit_conn_zone $server_name zone=inflight:1m;

    server {
        listen 8080;
        server_name ax-week06.treasuresky.xyz;
        limit_req zone=turns burst=30 nodelay;
        limit_req_status 429;
        limit_conn inflight 8;
        limit_conn_status 429;

        location / {
            proxy_pass http://seller:9998;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection '';
            proxy_connect_timeout 5s;
            proxy_read_timeout 280s;
            proxy_send_timeout 10s;
            proxy_buffering off;
        }
    }
}
