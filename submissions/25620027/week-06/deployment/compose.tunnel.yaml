services:
  ingress:
    image: nginx:stable-alpine@sha256:970364228b1e4f932abc22d321932816782cca8a20b85a77552a7cfe9acfb3b5
    restart: unless-stopped
    depends_on:
      seller:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'

  tunnel:
    image: cloudflare/cloudflared:2026.10.1@sha256:a15a3b50b8dabd57ac2090e9484c0247dba9dfa1f0df4d298d4317f9d69eb2d5
    command: [--no-autoupdate, --config, /etc/cloudflared/config.yml, tunnel, run]
    restart: unless-stopped
    depends_on:
      - ingress
    user: '65532:65532'
    volumes:
      - ./cloudflared.yml:/etc/cloudflared/config.yml:ro
    secrets:
      - tunnel_credentials
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'

secrets:
  tunnel_credentials:
    file: ${AX_TUNNEL_CREDENTIALS_FILE:?Set the private tunnel credential path}
