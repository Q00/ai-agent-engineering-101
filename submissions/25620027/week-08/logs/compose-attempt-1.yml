services:
  r3:
    profiles: [r3]
    build:
      context: ${AX_R3_BUNDLE:?Use the verified build-context directory}
      dockerfile: deploy/vps/Dockerfile
    image: ax-week08-25620027:prepared
    restart: "no"
    init: true
    read_only: true
    user: "10001:10001"
    command: ["--config", "/private/runtime.json", "--activate"]
    environment:
      AX_R3_ACTIVATE: ${AX_R3_ACTIVATE:-0}
      AX_MODEL_PROVIDER: openrouter-free
      AX_OPENAI_FALLBACK: "0"
      AX_PRICE_COMPARISON: "0"
      AX_SELLER_STATE_DB: /data/r3/seller.sqlite
      AX_MEMORY_JOURNAL: /data/r3/memory.sqlite
    env_file:
      - ${AX_R3_PRIVATE_DIR:?Supply an approved private directory}/model-market.env
    volumes:
      - ${AX_R3_PRIVATE_DIR}:/private:ro
      - ${AX_R3_DATA_DIR:?Supply an isolated writable data directory}:/data
    # The official proxy binds127.0.0.1; Linux host networking keeps it reachable
    # by the host's approved tunnel without publishing a container-wide listener.
    network_mode: host
    tmpfs: [/tmp:mode=1777,size=128m]
    mem_limit: 768m
    cpus: "1.0"
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
