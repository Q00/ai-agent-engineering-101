<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 232" role="img" aria-label="계정 하나가 한 표인 구조. 기존 거래가 있는 가게는 1점 1건이 그 계정 평균에 묻히지만, 첫 거래인 가게는 평균 1.0짜리 새 표가 그대로 추가된다.">
<style>text{font-family:'IBM Plex Mono','Noto Sans KR','Apple SD Gothic Neo',ui-monospace,monospace}</style>
<defs><marker id="ar2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#1C1917" stroke-width="1.5"/></marker></defs>
<g fill="#A8A29E" font-size="9.5" letter-spacing="1"><text x="10" y="14">같은 1점 1건</text><text x="232" y="14">그 계정의 평균 = 1표</text><text x="452" y="14">가게의 보정 별점</text></g>
<g fill="#FAFAF9" stroke="#1C1917" stroke-width="1.5"><rect x="10" y="28" width="180" height="62"/><rect x="232" y="28" width="180" height="62"/><rect x="452" y="28" width="218" height="62"/></g>
<g fill="none" stroke="#1C1917" stroke-width="1.5" marker-end="url(#ar2)"><path d="M190 59 L228 59"/><path d="M412 59 L448 59"/><path d="M190 153 L228 153"/><path d="M412 153 L448 153"/></g>
<g fill="#1C1917" font-size="11" font-weight="600"><text x="22" y="50">거래가 쌓인 가게</text><text x="244" y="50">평균 4.67</text><text x="464" y="50">거의 그대로</text></g>
<g fill="#78716C" font-size="9.5"><text x="22" y="66">기존 5점 11건</text><text x="22" y="79">+ 1점 1건</text><text x="244" y="66">(5×11 + 1) ÷ 12</text><text x="244" y="79">1점이 평균에 묻힌다</text><text x="464" y="66">표 수는 그대로,</text><text x="464" y="79">그 한 표만 5.00 → 4.67</text></g>
<g fill="#FFFFFF" stroke="#1C1917" stroke-width="2.5"><rect x="10" y="122" width="180" height="62"/><rect x="232" y="122" width="180" height="62"/><rect x="452" y="122" width="218" height="62"/></g>
<g fill="#1C1917" font-size="11" font-weight="600"><text x="22" y="144">첫 거래인 가게</text><text x="244" y="144">평균 1.00</text><text x="464" y="144">4.433 → 4.382</text></g>
<g fill="#78716C" font-size="9.5"><text x="22" y="160">SungJinho 외 1곳</text><text x="22" y="173">1점 1건이 전부</text><text x="244" y="160">1 ÷ 1</text><text x="244" y="173">새 표가 1.0으로 들어온다</text><text x="464" y="160">60표 → 61표</text><text x="464" y="173">학생 별점 백분위 0.856 → 0.500</text></g>
<path d="M10 106 L670 106" stroke="#A8A29E" stroke-width="1" stroke-dasharray="2 3"/>
<g fill="#78716C" font-size="9.5"><text x="10" y="208">보정 별점 = (계정별 평균의 합 + 15) ÷ (계정 수 + 5). 평가자의 학생 Class 등재 여부는 보지 않는다.</text><text x="10" y="222">SungJinho의 총점은 이 1건으로 1.774 → 1.703이 됐다. 직전 1위와의 차이는 0.011이었다.</text></g>
</svg>
