<g fill="#78716C" font-size="9.5"><text x="10" y="172">같은 계정이 같은 시간대(11/16 20:07~21:02)에 남긴 검증 평가다. 조건은 후기에 적힌 값 그대로다.</text><text x="10" y="186">SungJinho의 거래가 값은 더 낮고 기한은 비슷하거나 길다. 이 계정은 17:00~20:06에는 12개 가게에 199건 전부 1점을 줬다.</text><text x="10" y="200">21:02에 이 계정의 식품 주문 형식을 막았다. 13분 뒤 다른 형식(공산품)으로 1건이 더 들어와 1점이 됐다.</text><text x="10" y="216" fill="#A8A29E">두 계정은 공개 순위표의 학생 Class에 올라 있지 않다. 누가 운영하는지는 이 자료로 알 수 없다.</text></g>
