[project]
name = "week-08-system"
version = "0.1.0"
description = "Round 3 shop and buyer: rule hooks, operator kernel and memory server"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk[http-server]>=1.2.2",
    "cryptography>=50.0.2",
    "httpx>=0.28.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=8"]
# mem0 daemon only (memd/server.py), never imported by kernel/. Install with `uv sync --group memory`.
# torch must be the CPU build (same as `pip install torch --index-url https://download.pytorch.org/whl/cpu`);
# the pytorch-cpu index below pins it so uv never pulls the CUDA wheels.
memory = ["mem0ai==2.2.1", "sentence-transformers", "qdrant-client", "torch"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
