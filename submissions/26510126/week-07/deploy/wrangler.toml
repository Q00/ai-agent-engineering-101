name = "a2a-lamp-shop"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# One Durable Object per A2A task holds the task and its negotiation state,
# so every follow-up on the same taskId reaches the same state.
[[durable_objects.bindings]]
name = "TASKS"
class_name = "TaskObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TaskObject"]

# Workers AI stands in for the harness (claude -p cannot run in a Worker).
# No API key: the binding authenticates through the Cloudflare account. Free plan: 10,000 Neurons/day.
[ai]
binding = "AI"
