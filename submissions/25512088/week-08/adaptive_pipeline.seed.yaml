assumptions:
- acceptance_criteria의 각 verify_command에 명시된 criterion-specific unittest 파일을 submission 내부 tests/에 둘 수 있다.
- 공식 leaderboard의 최종 순위는 로컬 테스트가 아니라 Round 3 종료 시점의 공식 외부 기록으로 판정한다.
ontology_schema:
  name: Round3AutonomousTradingControl
  description: Round 3의 Buyer·Seller·procurement 운영, 공식 입력, 통계 실험, mutation reconciliation,
    코드 배포, Safety Kernel, Forum 신호 및 감사 증거를 통합해 표현하는 로컬 자율 운영 도메인 모델이다.
  fields:
  - name: role_runtime
    type: object
    description: Buyer, Seller, procurement의 실행 상태, 실행 commit, board alive, checkpoint
      및 supervisor 소유권
    required: true
  - name: official_input
    type: object
    description: rules, patch, agent.md, board, online, ledger, Forum 입력의 hash/version,
      조회시각, age, stale 및 우선순위
    required: true
  - name: experiment
    type: object
    description: 실험 ID, 역할, primary metric, guardrails, δ, assignment version·SHA-256 digest·arm, 표본,
      cluster, bootstrap seed, lift, confidence interval 및 판정
    required: true
  - name: experiment_unit
    type: object
    description: order_id, task_id, SKU×공급창, 성숙 정산 또는 게시물 단위와 멱등성·재시도 관계
    required: true
  - name: mutation
    type: object
    description: 고유 멱등성 키, mutation 상태, 영구 checkpoint, API 응답, ledger 확인 및 reconciliation
      결과
    required: true
  - name: deployment
    type: object
    description: 후보 commit, parameter set, 대상 역할, live impact, 검증·shadow·canary·active 상태, quarantine와 rollback 대상
    required: true
  - name: safety_kernel
    type: object
    description: 행동 직전 검증 상태, 절대 금지조건, hard envelope, trip 원인 및 recovery 결과
    required: true
  - name: hard_envelope
    type: object
    description: 최소실험 시작 전 검사하는 자본, 현금, 재고, SKU, 가격, 보상, 보증, Forum, 파라미터 변경폭의 불변 안전 경계
    required: true
  - name: bankruptcy_event
    type: object
    description: 공식 API·ledger bankruptcy 또는 forced-reset event ID, 시각, 원본 reference, 누적 횟수와 이후 위험 차단 판정
    required: true
  - name: adoption_threshold
    type: object
    description: 확대·채택에만 적용하는 역할별 primary δ, guardrail, 최소·2배 표본, CI, p/Holm과 판정 결과
    required: true
  - name: forum_signal
    type: object
    description: 작성자·역할·투표·refs 구조 필드, 교차검증 상태, 독립 작성자 추세, 전환 및 격리된 비신뢰 원문
    required: true
  - name: forum_publication
    type: object
    description: post·event ID, 역할, 게시 UTC·KST, 정규화 digest, 최대 Jaccard와 predecessor, 일일·간격 counter,
      공식 refs, correction predecessor, 직전·대조 6시간 rating baseline, 전환·dislike와 ACTIVE·STOPPED 판정
    required: true
  - name: state_transition
    type: object
    description: 공통 transition·machine·correlation ID, 이전·다음 상태, UTC·KST, rule hash, commit, 원인과
      machine별 조건부 experiment·deployment·mutation·safety ID 및 해당되는 표본·효과·비용·검증·rollback 결과
    required: true
  - name: runtime_event
    type: object
    description: 관찰창에 표시되는 검증, drain, checkpoint, stop/start, alive, commit, canary,
      promote 및 rollback 이벤트
    required: true
  - name: validation_run
    type: object
    description: 후보 commit별 syntax, unittest, diff, migration, Safety, secret, allowlist 검사의 명령·시작·종료·exit code·timeout과 증거
    required: true
  - name: command_execution
    type: object
    description: 외부 명령의 argv allowlist, process group, 시작·종료, timeout, TERM·KILL, exit code 및 정리 결과
    required: true
  - name: financial_snapshot
    type: object
    description: 판정 시점의 현금, 미정산 부채, Book, 운용자본, 재고 원가·슬롯·SKU 집중도와 계산 버전
    required: true
  - name: recovery_checkpoint
    type: object
    description: 역할별 ACTIVE commit·parameter set·PID 소유정보, mutation·procurement cursor, SQLite durable 위치와 복구 검증 결과
    required: true
  - name: windows_recovery_registration
    type: object
    description: 고정 scheduled-task 이름, WSL command, submission 경로, 설치·조회·제거 상태와 충돌 검사 결과
    required: true
  - name: worktree_guard
    type: object
    description: 후보 변경 경로, 사용자 tracked 변경 경로, 겹침·symlink escape·allowlist 검사와 격리 판정
    required: true
  - name: multiplicity_family
    type: object
    description: 동일 배포 결정에서 함께 판정한 experiment ID, primary metric p 순위, Holm 임계값과 통과 여부
    required: true
  - name: official_change
    type: object
    description: 공식 계약의 이전·새 hash/version, 발표·적용 시각, 소급 여부, PAUSED_INPUT 또는 INVALIDATED 판정
    required: true
  - name: evidence_cohort
    type: object
    description: 공식 변경 전후 rule hash, 시간 범위, experiment unit 집합, 소급 재계산 또는 비소급 분리 결과
    required: true
  - name: competitive_baseline
    type: object
    description: 공식 leaderboard endpoint·시각·원본 hash·rule hash, 학생·owner 식별자, 경쟁자 점수, 격차, 마일스톤과 최종 단독 순위 판정
    required: true
  - name: rank_forecast
    type: object
    description: 30초 관찰시각, 1·3·5·10위 점수·격차, 30분·2시간 속도, 선형 도달 예상시각, 공격 단계와 후보 점수효과/비용 순서
    required: true
  - name: leader_defense
    type: object
    description: ATTACK·DEFEND mode, 3회·60초 진입 증거, leader baseline, lead margin, catchup rate, time to loss, 위험 원인, 변경·노출 상한과 대응 결과
    required: true
evaluation_principles:
- name: 공식 성과
  description: 마감 시 공식 Class Player 단독 1위 달성 여부와 실제 주문·결제·정산 기반 성과를 가장 직접적으로 평가한다.
  weight: 0.25
- name: 안전성과 자본 보존
  description: Safety Kernel, 절대 금지조건, hard envelope, 미확정 거래 보호, 최대 파산 제한 및 live impact에 따른
    즉시 격리·롤백이 모든 성과 최적화보다 우선한다.
  weight: 0.25
- name: 통계적 타당성
  description: 고정 배정, 독립 cluster, 최소 표본, 사전 metric, bootstrap 신뢰구간, 다중검정 보정 및 확대 표본
    재현성을 평가한다.
  weight: 0.2
- name: 운영 복원력
  description: 중단·재개·멱등성·reconciliation·역할별 canary·자동 rollback·WSL 복구가 중복거래나 상태 손실
    없이 작동하는지 평가한다.
  weight: 0.15
- name: 감사 가능성
  description: 상태전이와 실험·배포 판정이 append-only 증거와 버전·시간·근거로 재현 가능하고 비밀을 노출하지 않는지 평가한다.
  weight: 0.1
- name: 범위와 사용자 변경 보존
  description: 자동 변경이 허용된 submission 영역에 한정되고 dirty worktree, 사용자 파일, 기존 로그, 공용·타인
    파일을 보존하는지 평가한다.
  weight: 0.05
exit_conditions:
- name: 목표 달성 종료
  description: 가능한 한 빨리 Class Player 단독 1위에 도달한 뒤 Round 3 공식 종료까지 유지하면 성과 workflow를 성공 종료한다.
  criteria: 조기 마일스톤 증거가 보존되고 2026-11-17 23:59 KST 종료 이후 최초 공식 snapshot에서 우리 Player ALL보다 높은 점수나 동점인 다른 player가 없다.
- name: 안전 격리 또는 롤백 종료
  description: 검증·shadow의 실패는 live 영향 없이 후보를 격리하고, canary·active 또는 live 실험의 Safety 위반,
    중복거래, 현금 하한 침범, 프로세스 종료, 신규 UNCERTAIN 1건은 안전한 이전 상태로 복귀한다.
  criteria: live_impact=false이면 QUARANTINED와 기존 ACTIVE 불변, live_impact=true이면 ROLLED_BACK과 이전 commit·parameter set 실행이며 PRESERVED·UNCERTAIN 거래는 reconciliation 상태로 보존된다.
- name: 미확정 거래 보존
  description: UNCERTAIN mutation의 결과를 30초 간격·10분·최대 20회 확인해도 결정할 수 없으면 해당 거래의 새 요청을
    중단하고 이후 공식 증거를 기다리며 보존한다.
  criteria: mutation이 PRESERVED이고 동일 거래 재제출이 차단되어 있으며 관련 없는 역할 운영은 계속된다.
- name: 입력 일시정지 또는 무효화
  description: hard stale·ledger gap은 관련 실험을 PAUSED_INPUT으로 일시정지하고, 공식 계약 hash/version 변경만
    INVALIDATED로 영구 무효화한다.
  criteria: PAUSED_INPUT은 동일 hash의 fresh 입력에서 이전 상태로 복귀하고 INVALIDATED는 새 experiment_id 없이는 재개되지 않는다.
- name: 성과 미달 폐기
  description: 최대 관찰 표본에서도 성공 기준을 충족하지 못한 실험이나 확대 표본에서 효과가 유지되지 않은 전략을 종료한다.
  criteria: 실험이 REJECTED 또는 ROLLED_BACK이고 기존 전략이 유지된다.
- name: 복구 불가능 보존 종료
  description: recovery checkpoint·hash, SQLite integrity, ACTIVE commit 또는 Safety 검사가 같은 복구에서 3회 연속 실패하면 모든 신규 mutation을 종료한다.
  criteria: 주문·가격·재고·게시를 포함한 신규 mutation이 모두 차단되고 reconciliation만 실행되며 현금·미정산 부채·재고·PRESERVED 상태가 checkpoint에 보존된다.
- name: 파산 한도 자본 보존 종료
  description: 공식 파산 1회 뒤 두 번째 파산을 유발할 projected-risk mutation만 종료한다.
  criteria: projected state가 공식 bankruptcy predicate 또는 500,000+미정산 부채 현금 하한을 위반하는 mutation은 차단되고 그 밖의 hard-envelope 내 기존 운영은 허용된다.
