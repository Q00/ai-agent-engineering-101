ontology_schema:
  name: Round3AutonomousTradingControl
  description: Round 3의 Buyer·Seller·procurement 운영, 공식 입력, 통계 실험, mutation reconciliation,
    코드 배포, Safety Kernel, Forum 신호 및 감사 증거를 통합해 표현하는 로컬 자율 운영 도메인 모델이다.
  fields:
  - name: role_runtime
    type: object
    description: Buyer, Seller, procurement의 실행 상태, 실행 commit, board alive, checkpoint
      및 supervisor 소유권
    required: true
  - name: official_input
    type: object
    description: rules, patch, agent.md, board, online, ledger, Forum 입력의 hash/version,
      조회시각, age, stale 및 우선순위
    required: true
  - name: experiment
    type: object
    description: 실험 ID, 역할, primary metric, guardrails, δ, 배정, 표본, cluster, bootstrap
      seed, lift, confidence interval 및 판정
    required: true
  - name: experiment_unit
    type: object
    description: order_id, task_id, SKU×공급창, 성숙 정산 또는 게시물 단위와 멱등성·재시도 관계
    required: true
  - name: mutation
    type: object
    description: 고유 멱등성 키, mutation 상태, 영구 checkpoint, API 응답, ledger 확인 및 reconciliation
      결과
    required: true
  - name: deployment
    type: object
    description: 후보 commit, parameter set, 대상 역할, 검증·shadow·canary·active 상태 및 rollback
      대상
    required: true
  - name: safety_kernel
    type: object
    description: 행동 직전 검증 상태, 절대 금지조건, hard envelope, trip 원인 및 recovery 결과
    required: true
  - name: hard_envelope
    type: object
    description: 자본, 현금, 재고, SKU, 가격, 보상, 보증, Forum, 파라미터 변경폭과 최소 개선폭의 불변 경계
    required: true
  - name: forum_signal
    type: object
    description: 작성자·역할·투표·refs 구조 필드, 교차검증 상태, 독립 작성자 추세, 전환 및 격리된 비신뢰 원문
    required: true
  - name: state_transition
    type: object
    description: 상태 머신 전이의 ID, UTC·KST, rule hash, commit, 근거, 표본, 효과, 비용, 노출 및 검증·rollback
      결과
    required: true
  - name: runtime_event
    type: object
    description: 관찰창에 표시되는 검증, drain, checkpoint, stop/start, alive, commit, canary,
      promote 및 rollback 이벤트
    required: true
  - name: validation_run
    type: object
    description: 후보 commit별 syntax, unittest, diff, migration, Safety, secret, allowlist 검사의 명령·시작·종료·exit code·timeout과 증거
    required: true
  - name: command_execution
    type: object
    description: 외부 명령의 argv allowlist, process group, 시작·종료, timeout, TERM·KILL, exit code 및 정리 결과
    required: true
  - name: financial_snapshot
    type: object
    description: 판정 시점의 현금, 미정산 부채, Book, 운용자본, 재고 원가·슬롯·SKU 집중도와 계산 버전
    required: true
  - name: recovery_checkpoint
    type: object
    description: 역할별 ACTIVE commit·parameter set·PID 소유정보, mutation·procurement cursor, SQLite durable 위치와 복구 검증 결과
    required: true
  - name: windows_recovery_registration
    type: object
    description: 고정 scheduled-task 이름, WSL command, submission 경로, 설치·조회·제거 상태와 충돌 검사 결과
    required: true
  - name: worktree_guard
    type: object
    description: 후보 변경 경로, 사용자 tracked 변경 경로, 겹침·symlink escape·allowlist 검사와 격리 판정
    required: true
  - name: multiplicity_family
    type: object
    description: 동일 배포 결정에서 함께 판정한 experiment ID, primary metric p 순위, Holm 임계값과 통과 여부
    required: true
  - name: official_change
    type: object
    description: 공식 계약의 이전·새 hash/version, 발표·적용 시각, 소급 여부, PAUSED_INPUT 또는 INVALIDATED 판정
    required: true
  - name: evidence_cohort
    type: object
    description: 공식 변경 전후 rule hash, 시간 범위, experiment unit 집합, 소급 재계산 또는 비소급 분리 결과
    required: true
  - name: competitive_baseline
    type: object
