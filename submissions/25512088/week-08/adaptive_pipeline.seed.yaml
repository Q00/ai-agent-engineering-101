ontology_schema:
  name: Round3AutonomousTradingControl
  description: Round 3의 Buyer·Seller·procurement 운영, 공식 입력, 통계 실험, mutation reconciliation,
    코드 배포, Safety Kernel, Forum 신호 및 감사 증거를 통합해 표현하는 로컬 자율 운영 도메인 모델이다.
  fields:
  - name: role_runtime
    type: object
    description: Buyer, Seller, procurement의 실행 상태, 실행 commit, board alive, checkpoint
      및 supervisor 소유권
    required: true
  - name: official_input
    type: object
    description: rules, patch, agent.md, board, online, ledger, Forum 입력의 hash/version,
      조회시각, age, stale 및 우선순위
    required: true
  - name: experiment
    type: object
    description: 실험 ID, 역할, primary metric, guardrails, δ, 배정, 표본, cluster, bootstrap
      seed, lift, confidence interval 및 판정
    required: true
  - name: experiment_unit
    type: object
    description: order_id, task_id, SKU×공급창, 성숙 정산 또는 게시물 단위와 멱등성·재시도 관계
    required: true
  - name: mutation
    type: object
    description: 고유 멱등성 키, mutation 상태, 영구 checkpoint, API 응답, ledger 확인 및 reconciliation
      결과
    required: true
  - name: deployment
    type: object
    description: 후보 commit, parameter set, 대상 역할, 검증·shadow·canary·active 상태 및 rollback
      대상
    required: true
  - name: safety_kernel
    type: object
    description: 행동 직전 검증 상태, 절대 금지조건, hard envelope, trip 원인 및 recovery 결과
    required: true
  - name: hard_envelope
    type: object
    description: 자본, 현금, 재고, SKU, 가격, 보상, 보증, Forum, 파라미터 변경폭과 최소 개선폭의 불변 경계
    required: true
  - name: forum_signal
    type: object
    description: 작성자·역할·투표·refs 구조 필드, 교차검증 상태, 독립 작성자 추세, 전환 및 격리된 비신뢰 원문
    required: true
  - name: state_transition
    type: object
    description: 상태 머신 전이의 ID, UTC·KST, rule hash, commit, 근거, 표본, 효과, 비용, 노출 및 검증·rollback
      결과
    required: true
  - name: runtime_event
    type: object
    description: 관찰창에 표시되는 검증, drain, checkpoint, stop/start, alive, commit, canary,
      promote 및 rollback 이벤트
    required: true
  - name: competitive_baseline
    type: object
    description: 공식 leaderboard 기준선, 경쟁자 모델, Class Player 점수와 최종 순위 판정
    required: true
evaluation_principles:
- name: 공식 성과
  description: 마감 시 공식 Class Player 단독 1위 달성 여부와 실제 주문·결제·정산 기반 성과를 가장 직접적으로 평가한다.
  weight: 0.25
- name: 안전성과 자본 보존
  description: Safety Kernel, 절대 금지조건, hard envelope, 미확정 거래 보호, 최대 파산 제한 및 즉시 롤백이
    모든 성과 최적화보다 우선한다.
  weight: 0.25
- name: 통계적 타당성
  description: 고정 배정, 독립 cluster, 최소 표본, 사전 metric, bootstrap 신뢰구간, 다중검정 보정 및 확대 표본
    재현성을 평가한다.
  weight: 0.2
- name: 운영 복원력
  description: 중단·재개·멱등성·reconciliation·역할별 canary·자동 rollback·WSL 복구가 중복거래나 상태 손실
    없이 작동하는지 평가한다.
  weight: 0.15
- name: 감사 가능성
  description: 상태전이와 실험·배포 판정이 append-only 증거와 버전·시간·근거로 재현 가능하고 비밀을 노출하지 않는지 평가한다.
  weight: 0.1
- name: 범위와 사용자 변경 보존
  description: 자동 변경이 허용된 submission 영역에 한정되고 dirty worktree, 사용자 파일, 기존 로그, 공용·타인
    파일을 보존하는지 평가한다.
  weight: 0.05
exit_conditions:
- name: 목표 달성 종료
  description: Round 3 공식 종료 시점에 Class Player가 단독 1위이면 성과 workflow를 성공 종료한다.
  criteria: 2026-11-17 23:59 KST 공식 leaderboard에서 Class Player보다 높은 점수나 동점인 다른 player가
    없다.
- name: 안전 롤백 종료
  description: Safety Kernel 위반, 중복거래, 현금바닥 침범, 프로세스 종료 또는 미확정 거래 누적 시 현재 변경을 중단하고
    안전한 이전 상태로 복귀한다.
  criteria: 영향받은 deployment 또는 experiment가 ROLLED_BACK이고 이전 commit·parameter set이
    실행되며 미확정 거래는 reconciliation 상태로 보존된다.
- name: 수동 보류 종료
  description: UNCERTAIN mutation의 결과를 공식 API·ledger·결제 파일로 확인할 수 없으면 자동 처리를 종료하고
    수동 보류한다.
  criteria: mutation이 MANUAL_HOLD이며 동일 거래 재제출과 관련 신규 mutation이 차단되어 있다.
- name: 입력 무효화 종료
  description: 공식 rule·patch·점수·비용·제한·API 계약 변경이나 hard stale가 발생하면 관련 자동 작업을 종료한다.
  criteria: 관련 가정과 실험이 INVALIDATED이고 신규 mutation·확대·배포가 중지되며 reconciliation만 실행된다.
- name: 성과 미달 폐기
  description: 최대 관찰 표본에서도 성공 기준을 충족하지 못한 실험이나 확대 표본에서 효과가 유지되지 않은 전략을 종료한다.
  criteria: 실험이 REJECTED 또는 ROLLED_BACK이고 기존 전략이 유지된다.
- name: 자본 보존 종료
  description: 안전한 복구가 불가능하거나 추가 진행이 파산 한도를 넘길 위험이 있으면 자동 확대와 신규 위험 노출을 종료한다.
  criteria: 신규 위험 mutation이 차단되고 현금·미정산 부채·재고 상태가 checkpoint에 보존된다.
