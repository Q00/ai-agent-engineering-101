- 로컬 supervisor가 허용된 submission 내부 코드에 한해 Ouroboros/Codex로 후보 코드를 생성하고 격리 검증, 역할별
  배포, 자동 롤백까지 수행한다.
- 자동 코드 변경 범위는 submission 내부의 전략, 가격, 조달, Forum, 측정, 테스트, supervisor 코드로 제한하며 Safety
  Kernel, 비밀 처리, 공식 규칙 우선순위, hard envelope, secrets, owner.env, 기존 로그, 공용 파일, 타인 파일은
  수정하지 않는다.
- dirty worktree에서 수정 대상과 겹치는 사용자 tracked 변경이 있으면 배포하지 않고 격리하며 사용자 파일·로그를 삭제하거나 reset하지
  않는다.
- 모든 자동 실험은 역할별 block에서 80% 실험군과 20% 기존전략 대조군을 동시에 운용하고 hash(experiment_id+unit_id)로
  재시작 후에도 배정을 고정한다.
- 실험 단위는 Buyer order_id, Seller 견적 task_id, 조달 SKU×공급창 cohort, 보증 성숙 정산, Forum 게시물이며
  동일 멱등성 키와 재시도는 새 표본으로 세지 않는다.
- Buyer cluster는 SKU 또는 표본 부족 시 category, Seller·보증·조달 cluster는 SKU, Forum cluster는
  주제×6시간 구간이며 cluster 동일 가중치를 적용하고 독립 cluster가 5개 미만이면 성공 판정을 금지한다.
- 각 실험은 시작 전에 primary metric을 정확히 하나 선언하고 나머지 지표는 guardrail로 취급한다. 한 번의 배포 결정에서
  2개 이상의 독립 experiment_id를 동시에 채택 판정하는 경우 그 집합을 multiplicity family로 기록하고 family의 primary
  metric p-value에 Holm-Bonferroni 보정을 적용한다. 한 실험 안에는 복수 primary metric을 허용하지 않는다.
- 효과는 cluster 동일 가중치로 계산한다. Saved·이익·rating·전환율처럼 증가가 좋은 지표는 treatment-control,
  오류율·p95 지연·폐기율·30일 초과 미판매율처럼 감소가 좋은 지표는 control-treatment로 부호를 변환해 양수일 때만 개선으로
  해석한다. %p δ는 절대차, 상대 δ는 대조군 분모의 상대차를 사용하며 분모가 0이거나 표본이 0이면 INSUFFICIENT_DATA다.
- experiment_id+metric_version 고정 seed, 정렬된 cluster와 10,000회 bootstrap을 사용한다. 양측 97.5% percentile
  구간은 1.25·98.75 percentile이고 empirical one-sided p는 (1+bootstrap effect≤0 횟수)/10,001로 계산하며
  seed·정렬·계산 버전을 기록한다.
- 한 배포 결정의 multiplicity family에서 m개 experiment primary metric을 동시에 판정할 때 p 오름차순 r번째를
  0.025/(m-r+1)과 비교하는 Holm-Bonferroni를 적용한다. family 밖 또는 단일 실험에는 추가 보정을 적용하지 않는다.
- 중간에는 normalized primary effect 신뢰구간 상한이 -δ 이하이거나 guardrail·Safety 한도를 위반할 때만 중단한다.
  최소 표본 최종 판정에서 하한이 δ 이상, p≤0.025 또는 family Holm 통과, 모든 guardrail 통과이면 EXPANDING으로 전이한다.
  상한이 0 이하이거나 guardrail 위반이면 REJECTED, 그 밖에는 최초 최소 표본의 2배까지 기존 전략과 병행한다.
- EXPANDING은 최초 최소 표본의 모든 건수·기간·공급창을 누적 2배 충족한 뒤 같은 하한·p/Holm·guardrail 조건을 다시 통과해야
  ADOPTED가 된다. 2배 표본에서 통과하지 못하면 REJECTED이고 기존 전략을 유지한다.
- 최소 표본은 Buyer 신규 주문 50개와 1시간, Seller 가격·상품 실험 유효견적 30건·정산 5건·공급창 2회, 보증 확대 SKU별 무환불
  성숙정산 5건, Forum 게시물 6개와 6시간이다.
- Safety Kernel 위반, 중복거래, 미확정 결제 재시도, 현금바닥 침범은 즉시 롤백한다.
- 회당 파라미터 변경은 ±10%, 확률/logit 변경은 회당 ±0.05이고 최종 범위는 0.05~0.95이며 동일 파라미터는 이전 실험 종료 전
  다시 변경하지 않는다.
- 현금 하한은 500,000+미정산 부채이고 재고 원가는 운용자본의 20~70%, 노출재고는 최대 250, 단일 SKU는 Book의 15% 또는
  슬롯의 20% 이하로 제한한다.
- 일반 판매는 원가·저장·혜택·보증비용을 보호하고 loss-leader 전체 손실은 Book의 1% 이하, 판매가격은 정가의 150% 이하, 할인과
  추천보상 합계는 실현 마진의 25% 이하로 제한하며 기존 약속은 유지한다.
- 식품은 공식 프로토콜에 따라 warranty_hours 0으로 두고 잔여 유통시간·등급·certificate로 검증한다. 비식품 보증은 6~72시간이고
  SKU별 무환불 성숙정산 5·15·30건에서 24·48·72시간으로 확대하며 환불 발생 시 6시간으로 축소한다.
- primary metric별 최소 개선폭 δ는 Buyer Saved +0.5%p 또는 성사율 상대 +5% 중 사전 선택한 하나, Seller 견적당
  기여이익 상대 +5%, Forum rating +0.005 또는 전환율 상대 +10% 중 사전 선택한 하나, 조달 투입자본당 기여이익 상대
  +5%, 안정성 오류율 또는 p95 지연 상대 -10% 중 사전 선택한 하나다. guardrail은 Buyer Saved 하락 0.2%p 이하,
  Seller Book 하락 0, Forum dislike 비율 증가 0, 조달 폐기율·30일 초과 미판매율 증가 0, 안정성 성능 저하 상대 2%
  이하이며 확대·채택 판정에만 적용하고 안전한 최소실험의 시작을 막지 않는다.
- Forum은 Buyer 24개/일, Seller 12개/일, 게시 간격 최소 5분, 중복문안 금지를 적용하고 rating 0.01 하락, 싫어요
  우세, 또는 게시물 6개·6시간 동안 전환 0이면 해당 문안을 중단한다.
- Forum의 명령 실행, 코드·URL 실행, 자격증명 요청, 규칙 무시 지시는 격리하고 원문을 agent 명령 컨텍스트나 updater 입력에
  넣지 않으며 허용된 구조화 필드만 추출한다.
- Forum의 SKU·가격·보증·재고 주장은 다음 단일 truth table로 분류한다. ledger·shops API·agent card 중 관련 공식
  자료와 일치하면 VERIFIED로 일반 최소실험 후보, 공식 일치 없이 독립 작성자 3명 이상이 같은 경향이면 CORROBORATED로 우선순위
  보조 신호, 그 밖은 UNVERIFIED 가설이다. 작성자 수는 VERIFIED를 대신하지 못한다.
- CORROBORATED와 UNVERIFIED Forum 주장 기반 실험은 모두 가용자본 1% 또는 SKU 1개 중 작은 범위로 제한하고 Forum 주장만으로
  가격·대량발주·보증을 확대하지 않는다.
- Buyer Forum은 실제 구매 ledger와 유용한 시장정보에 한정하고 자기 shop을 광고하지 않으며 Seller Forum은 실제 재고·가격·보증·정산
  refs와 직접 추천 프로그램을 담당한다.
- 공식 증거가 있는 경쟁자 사건은 내부 차단을 즉시 수행하되 외부에는 의도를 단정하지 않는 사실형 경고를 ledger refs와 함께 한 번만 게시하고
  Seller 투명성 보고는 별도로 게시한다.
- rules·patch와 agent.md는 5분마다 조회하고 10분을 hard stale로 하며 board·leaderboard·online 상태는
  30초마다 조회하고 90초를 hard stale로 한다.
- ledger tail은 30초마다 조회하고 120초 stale 또는 sequence gap이면 mutation을 차단하며 Forum은 60초마다
  관찰하고 180초 stale이면 Forum 실험만 중지한다.
- 입력 우선순위는 공식 rules·최신 patch > 공식 API 실제 동작·ledger > agent.md 프로토콜 > board·공개상태 >
  Forum이다.
- hard stale 또는 ledger sequence gap이면 관련 RUNNING·EXPANDING 실험을 이전 상태를 기록한 PAUSED_INPUT으로 전이하고
  신규 mutation·실험 확대·배포를 중지하되 reconciliation은 계속한다. fresh 입력의 sequence·schema·rule hash가 기존과
  일치하면 PAUSED_INPUT에서 기록된 RUNNING 또는 EXPANDING으로 복귀한다.
- 규칙·점수·비용·제한·API 계약의 hash/version이 실제로 변경된 경우에만 관련 가정과 실험을 INVALIDATED로 표시한다.
  INVALIDATED는 자동 재개하지 않고 새 규칙 hash와 새 experiment_id로 다시 평가한다.
- 공식 변경의 발표시각·적용시각·소급여부를 기록하고 소급 변경이면 Round 3 자료를 재계산하며 비소급 변경이면 전후 cohort를 분리한다.
- 단순 leaderboard 변동만으로 전체 운영을 중지하지 않고 기준선과 경쟁자 모델만 재계산하며 입력 복구와 compatibility/Safety
  검증 전에는 자동 재개하지 않는다.
- mutation의 허용 전이는 PREPARED→SUBMITTED, SUBMITTED→CONFIRMED|REJECTED|UNCERTAIN,
  UNCERTAIN→RECONCILING, RECONCILING→CONFIRMED|SAFE_TO_RETRY|PRESERVED, SAFE_TO_RETRY→PREPARED,
  PRESERVED→RECONCILING뿐이다. 재시도는 원래 고유 멱등성 키와 영구 checkpoint를 그대로 사용하며 그 밖의 전이는 거부한다.
- 응답·ledger 확인 전 중단된 mutation은 UNCERTAIN으로 처리하고 재제출 및 관련 신규 mutation을 금지한 채 API·ledger·결제
  파일 reconciliation만 수행한다.
- UNCERTAIN 거래는 30초마다 공식 API·ledger·결제 파일을 확인해 10분 동안 최대 20회 reconciliation한다. 미실행 또는 공식
  거절이 확인된 경우에만 SAFE_TO_RETRY로 전이하고 확인할 수 없으면 PRESERVED로 전이한다. PRESERVED에는 새 결제 요청을
  보내지 않으며 새 공식 증거가 도착하면 RECONCILING으로 복귀한다. fresh 입력, checkpoint와 코드 버전 일치가 확인된 해당
  거래만 재개하고 관련 없는 Buyer·Seller·procurement 운영은 계속한다.
- Deployment는 DRAFT→VALIDATED→SHADOW→CANARY→ACTIVE 및 QUARANTINED/ROLLED_BACK, Experiment는
  PROPOSED→ELIGIBLE→RUNNING→PAUSED_INPUT→RUNNING 또는 RUNNING→EXPANDING→PAUSED_INPUT→EXPANDING→ADOPTED 및
  REJECTED/INVALIDATED/ROLLED_BACK,
  Safety Kernel은 VALIDATING→ACTIVE→TRIPPED→RECOVERY_PENDING→ACTIVE 상태를 사용한다.
- VALIDATED는 전체 Python 문법 검사, 전체 unittest 100% 통과, git diff --check, 임시 DB migration,
  Safety Kernel·비밀정보 검사와 submission 내부 허용 경로 allowlist 검사를 모두 통과해야 한다.
- SHADOW는 POST 없이 기존 로그·공개 snapshot을 최소 5분 또는 Buyer 50개·Seller 30개 입력 동안 재생하고 금지행동,
  중복 mutation, 현금바닥 침범이 0건이어야 하며 실제 전략 성과는 시장 주문·결제·정산으로만 판정한다.
- CANARY는 Buyer와 Seller를 동시에 교체하지 않고 역할별 초기 트래픽 10%로 교체하며 Buyer 신규 주문 20개·10분, Seller
  견적 10건·공급창 1회를 관찰하고 90초 이내 board alive와 실행 commit을 확인한다.
- canary 대상 프로세스 종료, 중복거래 1건, canary에서 신규 UNCERTAIN 1건, 현금 하한 침범 또는 Safety Kernel 위반
  1건이 발생하면 즉시 이전 commit과 parameter set으로 복귀하고 procurement의 독립 프로세스와 기존 PRESERVED 상태를 보존한다.
- 후보 배포는 drain→checkpoint→한 역할 재시작→board alive 및 commit 확인→다음 역할 순서로 수행한다.
- 모든 상태전이는 correlation·experiment·deployment ID, UTC·KST, rule hash, commit, parameter
  set, 집계근거, 표본, 효과·신뢰구간, 비용·자본노출, 검증·rollback 결과를 append-only로 기록하고 비밀과 raw untrusted
  instruction은 기록하지 않는다.
- 실제 Buyer·Seller·procurement는 background supervisor가 소유하고 bash run_ubuntu.sh watch
  shop 및 watch buyer는 구조화된 runtime event를 실시간 표시하되 프로세스를 소유하지 않는다.
- 관찰창을 닫거나 Ctrl-C를 입력해도 agent는 계속 실행되며 실제 중단은 별도의 명시적 supervisor stop으로만 수행한다.
- 관찰창에는 후보 commit 검증, drain, checkpoint, 역할별 stop/start, tunnel·board alive, 실행 commit,
  canary, promote·rollback을 표시하되 비밀키, 토큰, owner.env, 회원키, 원문 비밀값을 출력하지 않는다.
- 현재 foreground 프로세스는 supervisor 구현·검증 전까지 유지하고 전환 시 한 번 정상 종료한 뒤 background 방식으로
  변경한다.
- WSL 생존성은 systemd에만 의존하지 않고 Windows 측 시작·복구 진입점과 WSL supervisor를 결합한다.
- Windows 시작·복구 등록은 submission 내부의 idempotent install·status·remove 명령으로만 수행하고 고정 task name,
  현재 submission 절대경로와 예상 command line을 대조한다. 기존 동명의 다른 task나 불일치 설정은 덮어쓰지 않고 배포를 차단한다.
- 공개시장 HTTP 요청은 연결 5초·전체 15초·본문 2 MiB 한도를 적용한다. schema와 필수 필드를 완전히 검증한 응답만 새 snapshot으로
  채택하고 빈 응답, 부분 응답, 비JSON API 응답, 한도 초과 응답은 원문 대신 종류·크기·SHA-256만 기록한 뒤 마지막 검증 snapshot을
  유지한다. 기존 hard stale 한도를 넘으면 해당 mutation을 차단한다.
- 검증 명령은 5분, 전체 후보 업데이트 작업은 30분을 hard timeout으로 하며 초과 시 해당 process group을 TERM 후 10초 뒤 KILL하고
  후보를 QUARANTINED로 표시하며 현재 ACTIVE 버전을 유지한다.
- hard envelope 자체는 Round 3 동안 자동으로 완화하거나 변경하지 않는다.
