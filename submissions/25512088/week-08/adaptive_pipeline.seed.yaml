  안전하게 지속 운영하고 코드·파라미터 실험, 검증, 역할별 배포, 관찰, 롤백을 무인 수행하는 로컬 supervisor pipeline을 완성한다.
task_type: code
brownfield_context:
  project_type: brownfield
  context_references:
  - path: /home/ohs/projects/ai-agent-engineering-101/submissions/25512088/week-08
    role: primary
    summary: 기존 Buyer·Seller·procurement, Safety Kernel, 로컬 SQLite 상태, 실행 스크립트와 Round
      3 자동화 코드를 확장할 작업공간
  existing_patterns:
  - Buyer와 Seller는 독립 역할로 공개 board alive 상태를 유지한다.
  - Buyer·Seller·procurement는 별도 프로세스로 실행되며 procurement의 독립 상태와 미확정 거래를 보존한다.
  - 기존 로컬 SQLite의 experiments, deployments, state_transitions, evolution_events를 운영
    상태와 감사 증거에 사용한다.
  - 공통 Safety Kernel은 실제 mutation 직전에 호출되어 금지 행동을 차단한다.
  - 상태전이와 운영 증거는 append-only로 기록하고 기존 로그는 수정하지 않는다.
