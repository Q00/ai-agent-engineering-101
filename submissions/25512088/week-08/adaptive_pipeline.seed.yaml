- 사람의 매번 승인은 요구하지 않지만 모든 자동 행동과 실험은 공통 Safety Kernel 및 hard envelope 안에서만 허용한다.
- 별도 원격 backend나 가상시장 simulator를 만들지 않고 기존 Buyer·Seller·procurement와 로컬 SQLite의 experiments,
