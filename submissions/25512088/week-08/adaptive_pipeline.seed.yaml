- 관찰창에는 후보 commit 검증, drain, checkpoint, 역할별 stop/start, tunnel·board alive, 실행 commit,
  canary, promote·rollback을 표시하되 비밀키, 토큰, owner.env, 회원키, 원문 비밀값을 출력하지 않는다.
