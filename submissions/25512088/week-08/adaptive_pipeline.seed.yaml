  description: Safety Kernel 위반, 중복거래, 현금바닥 침범, 프로세스 종료 또는 미확정 거래 누적 시 현재 변경을 중단하고
    안전한 이전 상태로 복귀한다.
  criteria: 영향받은 deployment 또는 experiment가 ROLLED_BACK이고 이전 commit·parameter set이
    실행되며 미확정 거래는 reconciliation 상태로 보존된다.
- name: 미확정 거래 보존
  description: UNCERTAIN mutation의 결과를 30초 간격·10분·최대 20회 확인해도 결정할 수 없으면 해당 거래의 새 요청을
    중단하고 이후 공식 증거를 기다리며 보존한다.
  criteria: mutation이 PRESERVED이고 동일 거래 재제출이 차단되어 있으며 관련 없는 역할 운영은 계속된다.
- name: 입력 일시정지 또는 무효화
  description: hard stale·ledger gap은 관련 실험을 PAUSED_INPUT으로 일시정지하고, 공식 계약 hash/version 변경만
    INVALIDATED로 영구 무효화한다.
  criteria: PAUSED_INPUT은 동일 hash의 fresh 입력에서 이전 상태로 복귀하고 INVALIDATED는 새 experiment_id 없이는 재개되지 않는다.
- name: 성과 미달 폐기
  description: 최대 관찰 표본에서도 성공 기준을 충족하지 못한 실험이나 확대 표본에서 효과가 유지되지 않은 전략을 종료한다.
  criteria: 실험이 REJECTED 또는 ROLLED_BACK이고 기존 전략이 유지된다.
- name: 자본 보존 종료
  description: 안전한 복구가 불가능하거나 추가 진행이 파산 한도를 넘길 위험이 있으면 자동 확대와 신규 위험 노출을 종료한다.
  criteria: 신규 위험 mutation이 차단되고 현금·미정산 부채·재고 상태가 checkpoint에 보존된다.
