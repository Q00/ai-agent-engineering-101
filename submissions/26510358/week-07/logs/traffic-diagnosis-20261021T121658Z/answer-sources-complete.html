  color: inherit;

  text-decoration-color: var(--secondary);
  text-underline-offset: 3px;
}
.source-preview-link:hover { text-decoration-style: solid; }
.popover.source-preview-card {
  display: block;

  z-index: 80;
  box-sizing: border-box;
  width: min(360px, calc(100vw - 24px));

  max-height: calc(100dvh - 24px);
  overflow: auto;
  padding: 16px;
  color: var(--text);

  font-size: 14px;
  line-height: 1.5;
  overflow-wrap: anywhere;

.source-preview-meta { display: flex; align-items: flex-start; gap: 6px; margin-bottom: 8px; color: var(--secondary); font-size: 12px; }
.source-preview-provider-icon { display: inline-flex; flex: 0 0 16px; width: 16px; height: 16px; margin-top: 1px; color: var(--text); }
.source-preview-provider-icon img { display: block; width: 16px; height: 16px; object-fit: contain; }
.source-preview-provider-mask { display: block; width: 16px; height: 16px; background: currentColor; mask: var(--source-provider-mask) center / contain no-repeat; -webkit-mask: var(--source-provider-mask) center / contain no-repeat; }
.source-preview-title { font-weight: 600; line-height: 1.4; }

`,Tn=`/* All overrides stay inside this receipt; the shared sidebar keeps its styling. */
:host {
  display: block;
  min-width: 0;
  color: var(--text);
  background: transparent;
  font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
  font-size: 14px;
  line-height: 1.6;
  font-kerning: normal;
  font-optical-sizing: auto;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
/* Classic receipts follow the live conversation tokens across the Shadow DOM.
   Inherit colliding token names before aliasing them for the receipt below;
   otherwise the bundled dashboard theme masks the host's chosen background.
   Explicit Data themes retain their own token declarations. */
:host([data-app-theme="codex-classic"]) {
  --background: inherit;
  --border: inherit;
  --receipt-host-background: var(--background, var(--color-background-primary, light-dark(#fff, #181818)));
  --receipt-host-border: var(--border, var(--color-border-secondary, light-dark(#ededed, #303030)));
  --text: var(--foreground, var(--color-text-primary, light-dark(#1a1c1f, #fff)));
  --secondary: var(--muted-foreground, var(--color-text-secondary, light-dark(#767676, #afafaf)));
  --surface-raised: var(--popover, var(--color-background-secondary, var(--receipt-host-background)));
  --accent: var(--accent-foreground, var(--color-text-info, light-dark(#216ab8, #99ceff)));
  --positive: var(--color-text-success, light-dark(#087f45, #4bd68a));
}
:host([data-app-theme="codex-classic"]) .sources-receipt {
  --background: var(--receipt-host-background);
  --border: var(--receipt-host-border);
}
.sources-receipt {
  --receipt-secondary: var(--secondary);
  --receipt-tertiary: var(--secondary);
  --receipt-subtle: color-mix(in srgb, var(--text) 4%, var(--background));
  --receipt-gray-50: var(--receipt-subtle);
  --receipt-hover: color-mix(in srgb, var(--text) 8%, transparent);
  --receipt-line: var(--border);
  --receipt-link: var(--accent);
  --receipt-green: var(--positive);
  --receipt-orange: var(--color-text-warning, color-mix(in srgb, var(--orange, var(--chart-4)) 75%, var(--text)));
  --receipt-icon-table: var(--receipt-green);
  --receipt-icon-file: var(--receipt-secondary);
  --receipt-icon-document: color-mix(in srgb, var(--purple, var(--chart-2)) 75%, var(--text));
  --receipt-icon-presentation: color-mix(in srgb, var(--yellow, var(--chart-6)) 60%, var(--text));
  --receipt-icon-code: color-mix(in srgb, var(--receipt-link) 65%, var(--receipt-green));
  --receipt-icon-image: color-mix(in srgb, var(--receipt-icon-document) 60%, var(--receipt-orange));
  --receipt-icon-video: color-mix(in srgb, var(--receipt-icon-document) 60%, var(--receipt-link));
  --receipt-icon-audio: color-mix(in srgb, var(--receipt-green) 75%, var(--receipt-link));
  --receipt-icon-dashboard: var(--receipt-orange);
  --receipt-icon-link: var(--receipt-link);
  --receipt-mono: var(--font-mono, ui-monospace, "SFMono-Regular", Menlo, monospace);
  width: 100%; min-width: 0; padding: 3px 0;
}
.sources-receipt *, .sources-receipt *::before, .sources-receipt *::after { box-sizing: border-box; }
.sources-receipt [hidden] { display: none !important; }
.sources-receipt button { font: inherit; }
.receipt-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.sources-receipt .receipt-disclosure {
  display: inline-flex; flex-wrap: wrap; max-width: 100%; align-items: center; gap: 4px; min-height: 26px;
  padding: 4px 0; margin-inline-start: 0; border: 0; border-radius: 6px;
  background: transparent; color: var(--receipt-tertiary); cursor: pointer;
  font-size: 14px; font-weight: 400; line-height: 18px;
  transition: opacity 150ms ease;
}
.receipt-disclosure:hover { opacity: .75; }
.receipt-disclosure > img { display: block; flex: 0 0 auto; }
.receipt-disclosure[aria-expanded="true"] > :last-child { transform: rotate(0deg); }
.receipt-disclosure > :last-child { transform: rotate(-90deg); transition: transform 190ms cubic-bezier(.2,.7,.2,1); }
.receipt-expander {
  display: grid; grid-template-rows: 1fr; margin-top: 8px; opacity: 1;
  transition: grid-template-rows 220ms cubic-bezier(.2,.75,.2,1), opacity 160ms ease, margin-top 220ms cubic-bezier(.2,.75,.2,1);
}
.receipt-expander[data-open="false"] { grid-template-rows: 0fr; margin-top: 0; opacity: 0; pointer-events: none; }
.receipt-expander-inner { min-width: 0; min-height: 0; overflow: hidden; }
.receipt-cards { display: grid; grid-template-columns: minmax(0, 1fr); width: 100%; min-width: 0; gap: 8px; }
.receipt-card {
  position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 24px;
  width: 100%; min-width: 0; padding: 16px; border: 1px solid var(--receipt-line);
  border-radius: 24px; background: var(--background); box-shadow: none;
  transition: padding 190ms cubic-bezier(.2,.75,.2,1), border-radius 190ms cubic-bezier(.2,.75,.2,1), background-color 140ms ease;
}
.receipt-card[data-open="false"] { min-height: 38px; padding: 8px 12px; border-radius: 16px; }
.receipt-card-toggle {
  position: static; z-index: 1; grid-area: 1 / 2; justify-self: end; align-self: start;
  display: grid; width: 16px; height: 22.4px; place-items: center;
  margin: 0; padding: 0; border: 0; border-radius: inherit; background: transparent; color: var(--text); cursor: pointer;
  transition: width 190ms cubic-bezier(.2,.75,.2,1), height 190ms cubic-bezier(.2,.75,.2,1), margin-top 190ms cubic-bezier(.2,.75,.2,1), background-color 140ms ease;
}
.receipt-card-label {
  grid-area: 1 / 1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  min-width: 0; font-size: 14px; font-weight: 400; line-height: 1.6;
  letter-spacing: -.14px; overflow-wrap: anywhere;
}
/* Stretch the native button over the collapsed card, including its padding and
   border. Expanded content keeps its own independent interactive controls. */
.receipt-card[data-open="false"] .receipt-card-toggle::after { content: ""; position: absolute; inset: -1px; border-radius: inherit; }
.receipt-card[data-open="true"] .receipt-card-toggle { width: 24px; height: 24px; border-radius: 6px; }
.receipt-card[data-open="true"]:has(.receipt-card-toolbar .source-tabs) > .receipt-card-toggle { margin-top: 3px; }
.receipt-card[data-open="true"] .receipt-card-toggle:hover { background: var(--receipt-hover); }
.receipt-card-toggle > :last-child { transform: rotate(0deg); }
.receipt-card[data-open="true"] .receipt-card-toggle > :last-child { transform: rotate(180deg); }
.receipt-card-toggle > :last-child, .receipt-card-collapse > :last-child {
  flex: 0 0 auto; color: var(--receipt-tertiary);
  transition: color 140ms ease, transform 190ms cubic-bezier(.2,.75,.2,1);
}
.receipt-card-toggle:hover > :last-child, .receipt-card-toolbar:hover .receipt-card-collapse > :last-child { color: var(--text); }
.receipt-card-content { grid-area: 1 / 1 / 2 / 3; display: flex; min-width: 0; min-height: 0; flex-direction: column; }
.receipt-card-collapse {
  display: grid; width: 24px; height: 24px; flex: 0 0 auto; place-items: center;
  padding: 0; border: 0; border-radius: 6px; background: transparent; cursor: pointer;
  transition: background-color 140ms ease;
}
.receipt-card-collapse > * { transform: rotate(180deg); }
.receipt-card-collapse:hover { background: var(--receipt-hover); }
.receipt-card-toolbar { display: flex; min-width: 0; align-items: center; justify-content: space-between; gap: 8px; }
.receipt-card-toolbar:has(.receipt-card-collapse, .receipt-card-collapse-placeholder) { cursor: pointer; }
.receipt-card-collapse-placeholder { width: 24px; height: 24px; flex: 0 0 auto; }
.receipt-card-title { flex: 1 1 auto; margin: 0; font-size: 14px; font-weight: 400; line-height: 22px; }
.receipt-overview-only > .receipt-card-toolbar + .source-section { margin-top: 16px; }
.receipt-source-section { display: grid; min-width: 0; gap: 16px; }
.receipt-source-section + .receipt-source-section { margin-top: 20px; }
.receipt-source-heading { margin: 0; color: var(--text); font-size: 14px; font-weight: 500; line-height: 22px; }
.receipt-method {
  min-width: 0; max-width: 100%; margin: 0; font-family: var(--receipt-mono); font-size: 12px;
  line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere;
}
.receipt-method { padding: 8px; border: 1px solid var(--receipt-line); border-radius: 8px; background: var(--background); }
/* Embedded browsers can retain :focus-visible after a pointer focus. Keep
   actual focus intact, but show its indicator only after keyboard input. */
.sources-receipt :focus { outline: none; }
.sources-receipt[data-input-modality="keyboard"] :is(button, a, summary, [role="tab"], [role="tabpanel"], [data-source-title], .receipt-trace-table-scroll):focus {
  outline: 2px solid var(--ring, var(--receipt-link)); outline-offset: 3px;
}
.sources-receipt[data-input-modality="keyboard"] .receipt-disclosure:focus { outline-offset: -2px; }
.sources-receipt[data-input-modality="keyboard"] [role="tabpanel"]:focus { outline-offset: -2px; }
.sources-receipt .receipt-card[data-open="false"] .receipt-card-toggle:focus { outline: none; }
.sources-receipt[data-input-modality="keyboard"] .receipt-card[data-open="false"] .receipt-card-toggle:focus::after { outline: 2px solid var(--ring, var(--receipt-link)); outline-offset: -3px; }
.sources-receipt .source-inspector { min-width: 0; }
.sources-receipt .source-tabs {
  position: relative; isolation: isolate; z-index: auto; display: flex; align-items: center;
  flex: 1 1 auto; gap: 2px; flex-wrap: nowrap; min-width: 0;
  padding: 0; margin: 0; border: 0; overflow-x: auto; scrollbar-width: none; background: transparent;
}
.sources-receipt .source-tabs::-webkit-scrollbar { display: none; }
.sources-receipt .source-tabs [role="tab"] {
  flex: 0 0 auto; min-height: 30px; padding: 4px 10px; border: 0; border-radius: 999px;
  background: transparent; color: var(--receipt-tertiary); font-size: 14px; font-weight: 400;
  line-height: 22px; white-space: nowrap; cursor: pointer;
  transition: background-color 150ms ease, color 150ms ease;
}
.sources-receipt .source-tabs [role="tab"]:is(:hover, [aria-selected="true"]) { color: var(--text); background: transparent; }
.sources-receipt .tab-active-indicator {
  display: block; position: absolute; z-index: -1; top: 0; left: 0; bottom: auto;
  height: 30px; border-radius: 999px; background: var(--receipt-subtle); pointer-events: none;
}
.receipt-panels {
  min-width: 0; margin-top: 16px;
}
.receipt-panels[data-anchored] { height: max(var(--receipt-overview-height), 10lh); }
.sources-receipt .receipt-panels[data-anchored] > .source-section {
  height: 100%; overflow: auto; overscroll-behavior: contain; scrollbar-gutter: stable;

.sources-receipt .source-section {
  display: block; width: 100%; min-width: 0; height: auto; min-height: 0; padding: 0;
  overflow-wrap: anywhere;
